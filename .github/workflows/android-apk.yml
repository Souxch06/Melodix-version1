name: APK Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_test_apk:
        description: "Publier une GitHub Release de test (tag v<version>) avec l'APK en asset"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # URL du backend Melodix intégrée à l'APK (métadonnées Spotify, voir
      # server/). Variable de dépôt MELODIX_BACKEND_URL (Settings → Secrets and
      # variables → Actions → onglet Variables). Sans elle, l'app retombe sur
      # le catalogue Audius et l'historique local — jamais de config Spotify.
      MELODIX_BACKEND_URL: ${{ vars.MELODIX_BACKEND_URL }}
      # Facultatif : clé API Audius intégrée à l'APK (gratuite, dashboard Audius).
      # Sans elle, la couche audio interroge les nœuds publics de découverte.
      AUDIUS_API_KEY: ${{ vars.AUDIUS_API_KEY }}
      # Client ID de l'application Spotify « Melodix » du mainteneur (OAuth
      # PKCE au démarrage ; un Client ID n'est pas secret). Variable de dépôt
      # optionnelle : SANS LUI, l'APK compile et l'écran de connexion affiche
      # proprement « Connexion Spotify non configurée » — JAMAIS d'identifiant
      # d'une application tierce/exemple embarqué en production.
      # Deux canaux d'injection : extra de app.config (asset natif) + inlinage
      # Metro EXPO_PUBLIC_* (robuste en APK bare — voir services/spotify/authConfig).
      # Client ID Spotify : Variables du dépôt → ABSENT sinon. Aucun input
      # manuel : la valeur n'est jamais saisie dans l'UI et n'apparaît donc
      # jamais dans un log de dispatch.
      # OAuth PKCE : aucun secret n'entre jamais ici — l'ID est public par
      # conception, mais il n'existe que si le mainteneur l'a créé.
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID || '' }}
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID || '' }}
      # ── Redirect URI OAuth — CANONIQUE DE L'APPLICATION ──
      # L'application « Melodix » (scheme natif `melodix`, package
      # com.souxch06.melodix) déclare EXACTEMENT melodix://callback dans le
      # Dashboard Spotify de son Client ID. Tout build APK — en particulier
      # le build destiné au test physique — DOIT embarquer ce redirect.
      # L'ancienne URI de test historique comspotifytestsdk://callback
      # (dashboard de test périmé) ne doit JAMAIS alimenter un build : c'est
      # elle qui a produit l'erreur « redirect_uri: not matching
      # configuration » au test physique — le redirect envoyé ne figurait
      # plus dans la configuration du client.
      # Unicité de source : Spotify exige la même chaîne à /authorize ET
      # /api/token — les deux canaux (inlinage Metro + asset natif
      # app.config.js extra) reçoivent le MÊME littéral, vérifié avant le
      # build (cohérence) et dans l'APK final (manifest + bundle).
      # Le scheme natif `melodix` EST le scheme du redirect : expo prebuild
      # génère l'intent-filter melodix://callback à partir de cette URI.
      SPOTIFY_REDIRECT_URI: 'melodix://callback'
      EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: 'melodix://callback'
      # FIXTURE SMOKE (build de test uniquement) : active la route
      # melodix://oauth-smoke-seed qui seede une transaction PKCE
      # déterministe en SecureStore, permettant au smoke Android de vérifier
      # le wiring cold-start « transaction persistée → processus tué →
      # callback → verifier restauré → exchange ». Aucun faux login :
      # l'échange exige toujours un code Spotify réel. Le login normal
      # (transaction live) est inchangé ; la variable est absente des builds
      # de production (route inactive, aucun effet de bord).
      EXPO_PUBLIC_SPOTIFY_OAUTH_SMOKE: '1'
      # Empreinte SHA-256 attendue : variable mainteneur si définie, sinon
      # certificat de TEST stable du template Expo actuel. Toute rotation
      # involontaire casse le workflow plutôt que les mises à jour Android.
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' }}
      # Sur pull_request, github.sha est le commit de merge synthétique. On
      # construit et nomme explicitement le vrai HEAD de la branche testée.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # AUCUN Client Secret / refresh token dans l'APK : le Client Secret n'existe
      # pas côté mobile (PKCE), aucun secret serveur dans le bundle.
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Installer Node.js 20 (résolution de la config effective)
        # La validation Spotify ci-dessous résout la config EFFECTIVE via
        # `node -p require('./app.config.js')` : Node doit donc être présent
        # AVANT cette validation. Sans cache ici — le cache npm vit sur
        # l'installation positionnée juste avant `npm ci`.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20

      - name: Valider la config Spotify du build (deterministe)
        # Contrat STRICT du BUILD — vérifié AVANT tout build :
        #   1. Client ID : la valeur EFFECTIVE DOIT être un Client ID valide
        #      (32 hex). Source unique = app.config.js : l'override env
        #      (variable de dépôt SPOTIFY_CLIENT_ID) prime s'il est présent,
        #      sinon le défaut committé (DEFAULT_SPOTIFY_CLIENT_ID) s'applique.
        #      Sans valeur valide, le build échoue clairement plutôt que de
        #      produire un APK non testable. PKCE — aucun secret, jamais de
        #      champ Client ID dans l'UI.
        #   2. Redirect URI : DOIT être EXACTEMENT le redirect canonique
        #      melodix://callback (celui déclaré dans le Dashboard Spotify du
        #      client Melodix). Les deux canaux (inlinage Metro + asset natif)
        #      DOIVENT être cohérents. L'ancienne URI de test historique
        #      comspotifytestsdk://callback = ÉCHEC explicite (dashboard périmé
        #      → « redirect_uri: not matching configuration » garanti).
        #   3. Valeur INVALIDE (ex. un access token collé à la place) →
        #      erreur claire et échec AVANT le build.
        run: |
          # Redirect canonique de l'application — source unique du workflow.
          CANONICAL_REDIRECT_URI='melodix://callback'
          norm_cid() {
            if [[ "$1" =~ ^[0-9a-fA-F]{32}$ ]]; then echo "$1"; return 0; fi
            return 1
          }
          norm_uri() {
            # Validate the complete value before writing it to GITHUB_ENV;
            # whitespace/CRLF could otherwise inject another environment entry.
            if [[ "$1" =~ ^[a-zA-Z][a-zA-Z0-9+.-]*://[^[:space:]]+$ ]]; then echo "$1"; return 0; fi
            return 1
          }
          # ── Client ID effectif : override env (variable de dépôt) ou
          #    défaut committé — résolu sur la SOURCE UNIQUE du build.
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
            case "${SPOTIFY_CLIENT_ID}" in
              *$'\n'*)
                echo "::error title=SPOTIFY_CLIENT_ID corrompu::la variable de dépôt SPOTIFY_CLIENT_ID contient un caractère de nouvelle ligne (recopie avec le saut de ligne final). La valeur reçue n'est pas affichée."
                exit 1
                ;;
            esac
            if ! norm_cid "${SPOTIFY_CLIENT_ID}" >/dev/null; then
              echo "::error title=SPOTIFY_CLIENT_ID invalide::un Client ID Spotify doit contenir exactement 32 caractères hexadécimaux. La valeur reçue n'est pas affichée."
              exit 1
            fi
          fi
          CID="$(node -p "require('./app.config.js').expo.extra.spotifyClientId")"
          if ! CID="$(norm_cid "${CID:-}")"; then
            if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
              echo "::error title=Client ID effectif invalide::l'override env SPOTIFY_CLIENT_ID est défini mais la config effective de app.config.js ne le reflète pas. La valeur reçue n'est pas affichée."
            else
              echo "::error title=Client ID absent du build::ni la variable de dépôt SPOTIFY_CLIENT_ID ni le défaut committé (app.config.js : DEFAULT_SPOTIFY_CLIENT_ID) ne fournit un Client ID valide — le test physique Spotify est impossible. Le workflow ne produit pas un APK non testable en silence."
            fi
            exit 1
          fi
          if [ -z "${SPOTIFY_CLIENT_ID:-}" ]; then
            echo "::notice title=Client ID::variable de dépôt absente — utilisation du défaut committé (app.config.js : DEFAULT_SPOTIFY_CLIENT_ID)"
          fi
          if ! RU="$(norm_uri "${SPOTIFY_REDIRECT_URI:-}")"; then
            echo "::error title=Redirect URI Spotify invalide::format scheme://destination attendu. La valeur reçue n'est pas affichée."
            exit 1
          fi
          # Cohérence des DEUX canaux d'injection (Metro + asset natif) :
          # Spotify exige la même chaîne à /authorize et /api/token.
          if [ "${EXPO_PUBLIC_SPOTIFY_REDIRECT_URI:-}" != "$RU" ]; then
            echo "::error title=Canaux Redirect URI incohérents::SPOTIFY_REDIRECT_URI et EXPO_PUBLIC_SPOTIFY_REDIRECT_URI divergent — /authorize et /api/token enverraient deux redirect différents. La valeur reçue n'est pas affichée."
            exit 1
          fi
          # Déterminisme du build : le redirect doit être EXACTEMENT le
          # canonique déclaré dans le Dashboard Spotify du client.
          # comspotifytestsdk://callback = ÉCHEC explicite (URI de test
          # historique, dashboard périmé — mismatch garanti).
          if [ "$RU" != "$CANONICAL_REDIRECT_URI" ]; then
            if [ "$RU" = "comspotifytestsdk://callback" ]; then
              echo "::error title=Redirect URI de test historique refusé::comspotifytestsdk://callback est l'ancienne URI de test (dashboard périmé) — elle ne doit JAMAIS alimenter un build réel (erreur « redirect_uri: not matching configuration » garantie). Attendu : $CANONICAL_REDIRECT_URI"
            else
              echo "::error title=Redirect URI inattendu::le build doit embarquer exactement $CANONICAL_REDIRECT_URI (déclaré dans le Dashboard Spotify du client) — reçu : $RU."
            fi
            exit 1
          fi
          echo "::notice title=Config Spotify du build::Redirect URI = $RU (canonique — Dashboard Spotify du client, les deux canaux cohérents) · Client ID = présent (32 hex, valeur non affichée) · PKCE sans secret"
          {
            echo "SPOTIFY_CLIENT_ID=$CID"
            echo "EXPO_PUBLIC_SPOTIFY_CLIENT_ID=$CID"
            echo "SPOTIFY_REDIRECT_URI=$RU"
            echo "EXPO_PUBLIC_SPOTIFY_REDIRECT_URI=$RU"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # GARDE-FOUS DE PUBLICATION — résolus AVANT tout build, pour qu'un
      # tag, un nom d'APK et une Release ne puissent jamais pointer ailleurs
      # que sur le commit réellement construit.
      # ------------------------------------------------------------------
      - name: Résoudre le tag de release de test et vérifier la branche
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUILD_SHA: ${{ env.BUILD_SHA }}
          PUBLISH: ${{ inputs.publish_test_apk }}
        run: |
          set -Eeuo pipefail
          PUBLISH_TEST=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "${PUBLISH:-false}" = "true" ]; then
            PUBLISH_TEST=true
          fi
          echo "publish_test=$PUBLISH_TEST" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH_TEST" != "true" ]; then
            echo "::notice title=Publication::build sans Release (publish_test_apk désactivé)"
            exit 0
          fi

          # 1. Seule la branche de travail autorisée publie une Release de test.
          #    `main` ou toute autre branche → ÉCHEC explicite, jamais de
          #    Release « verte » construite depuis un commit non annoncé.
          if [ "$REF" != "refs/heads/arena/01a106dd-melodix" ]; then
            echo "::error title=Branche de publication refusée::la Release de test ne peut être publiée que depuis refs/heads/arena/01a106dd-melodix (reçu : $REF). Aucune Release créée."
            exit 1
          fi

          # 2. Le commit construit doit exister et être annoncé explicitement.
          if [ -z "$BUILD_SHA" ]; then
            echo "::error title=Commit absent::BUILD_SHA vide — rien ne sera publié."
            exit 1
          fi
          echo "commit=$BUILD_SHA" >> "$GITHUB_OUTPUT"

          # 3. Tag dérivé de la version du projet (jamais d'un SHA qui
          #    dériverait à chaque run). Si le tag existe DÉJÀ sur un autre
          #    commit, on incrémente le numéro de test : aucune Release
          #    existante n'est écrasée ni supprimée.
          BASE="v$(node -p "require('./package.json').version")"
          TAG="$BASE"
          N=1
          while :; do
            # Un tag ANNOTÉ pointe sur un objet tag, pas directement sur le
            # commit : il faut le déréférencer, sinon on comparerait un objet
            # tag au commit construit et on écraserait une Release étrangère.
            # NB : sur un 404, `gh api` écrit le corps d'erreur sur stdout —
            # tester seulement la non-vacité ferait croire que le tag existe.
            # On valide donc le TYPE réel renvoyé par l'API.
            OBJ_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.type' 2>/dev/null || true)
            case "$OBJ_TYPE" in
              tag | commit) ;; # le tag existe bel et bien
              *) break ;;     # absent (404) ou réponse inattendue → tag libre
            esac
            OBJ_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha' 2>/dev/null || true)
            if [ "$OBJ_TYPE" = "tag" ]; then
              EXISTING_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJ_SHA" \
                --jq '.object.sha' 2>/dev/null || true)
            else
              EXISTING_COMMIT="$OBJ_SHA"
            fi
            if [ -n "$EXISTING_COMMIT" ] && [ "$EXISTING_COMMIT" = "$BUILD_SHA" ]; then
              echo "::notice title=Tag réutilisé::$TAG pointe déjà sur le commit construit — la Release sera mise à jour, aucune autre Release touchée."
              break
            fi
            # Tag déjà pris par un AUTRE commit : on incrémente le numéro de
            # test. Aucune Release existante n'est écrasée ni supprimée.
            echo "::warning title=Tag déjà pris::$TAG pointe sur $EXISTING_COMMIT (commit construit : $BUILD_SHA) — numéro de test suivant."
            N=$((N + 1))
            TAG="${BASE%%-test.*}-test.$N"
            if [ "$N" -gt 20 ]; then
              echo "::error title=Tag indisponible::aucun numéro de test libre après $BASE."
              exit 1
            fi
          done
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release de test::tag=$TAG commit=$BUILD_SHA"

      - name: Installer Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier TypeScript, ESLint et Prettier
        run: |
          npx tsc --noEmit
          npm run lint
          npm run prettier:check
          git diff --check

      - name: Tests JavaScript / React Native
        # Les tests pilotent eux-mêmes les états OAuth configuré/absent. Ils ne
        # doivent pas dépendre des Variables du dépôt injectées pour l'APK.
        env:
          SPOTIFY_CLIENT_ID: ''
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ''
          SPOTIFY_REDIRECT_URI: ''
          EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: ''
          # Les tests pilotent eux-mêmes la fixture smoke (process.env) ;
          # le build de test APK de ce run reste flagué plus bas, volontairement.
          EXPO_PUBLIC_SPOTIFY_OAUTH_SMOKE: ''
        run: |
          set -o pipefail
          npm test -- --runInBand 2>&1 | tee jest.log

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Vérifier la configuration Android générée
        run: |
          # Version attendue : source UNIQUE = app.config.js. Le prebuild doit
          # copier EXACTEMENT la version déclarée — vérifié sans constante qui
          # divergerait à chaque bump.
          EXPECTED_VC=$(node -p "require('./app.config.js').expo.android.versionCode")
          EXPECTED_VN=$(node -p "require('./app.config.js').expo.version")
          # APK universel : ne pas retirer x86/x86_64 sans connaître l'appareil
          # cible. Le gradle.properties Expo généré doit conserver les quatre ABI.
          grep -Fq "applicationId 'com.souxch06.melodix'" android/app/build.gradle
          grep -Fq "namespace 'com.souxch06.melodix'" android/app/build.gradle
          grep -Fq "versionCode $EXPECTED_VC" android/app/build.gradle
          grep -Fq "versionName \"$EXPECTED_VN\"" android/app/build.gradle
          grep -Eq '^reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64$' android/gradle.properties
          # Redirect Spotify CANONIQUE (melodix://callback) : le scheme natif
          # `melodix` (déclaré SANS host) est l'intent-filter MÊME qui route
          # le callback Spotify — un data à scheme seul matche TOUTES les
          # URLs melodix://*, dont melodix://callback?code=…&state=… (l'app
          # vérifie ensuite le redirect exact côté JS). Sans lui, le callback
          # Spotify ne reviendrait jamais à l'app → échec AVANT de construire
          # l'APK.
          grep -Fq 'android:scheme="melodix"' android/app/src/main/AndroidManifest.xml
          # L'ancienne URI de test historique ne doit JAMAIS se retrouver dans
          # un build réel : son dashboard est périmé (mismatch garanti).
          if grep -Fq 'android:scheme="comspotifytestsdk"' android/app/src/main/AndroidManifest.xml; then
            echo "::error title=Build contaminé par l'ancienne URI de test::comspotifytestsdk présente dans le manifest — le build ne peut pas servir au test physique Spotify"
            exit 1
          fi
          grep -Fq 'android:name="expo.modules.melodixmedia.MelodixMediaService"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:foregroundServiceType="mediaPlayback"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name="androidx.media3.session.MediaSessionService"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          for permission in RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW; do
            # blockedPermissions laisse volontairement une directive
            # tools:node="remove" dans le manifest source ; elle n'est pas une
            # permission du manifest fusionné final.
            if grep -F "android.permission.$permission" android/app/src/main/AndroidManifest.xml | grep -Fvq 'tools:node="remove"'; then
              echo "::error title=Permission Android inattendue::$permission ne correspond à aucune fonction de Melodix"
              exit 1
            fi
          done

          # THÈME DÉTERMINISTE (anti « double sombre » — plugins/withMelodixTheme) :
          # sans forceDarkAllowed=false, les appareils au thème système sombre
          # appliquent leur transformation forced dark sur notre UI déjà sombre
          # (cause du contraste illisible observé au test physique 4.5.0-test.1).
          FD_COUNT=$(grep -Fc 'android:forceDarkAllowed="false"' android/app/src/main/AndroidManifest.xml || true)
          if [ "${FD_COUNT:-0}" -lt 2 ]; then
            echo "::error title=Thème Android non déterministe::android:forceDarkAllowed=\"false\" manquant (application + MainActivity) — l OS peut double-assombrir l UI sur thème système sombre"
            exit 1
          fi
          if grep -Fq 'Theme.AppCompat.Light' android/app/src/main/res/values/styles.xml; then
            echo "::error title=Thème Android non déterministe::AppTheme hérite d un thème Light — le plugin withMelodixTheme ne s est pas appliqué"
            exit 1
          fi
          grep -Fq '<item name="android:windowBackground">#121212</item>' android/app/src/main/res/values/styles.xml
          grep -Fq '<item name="android:navigationBarColor">#121212</item>' android/app/src/main/res/values/styles.xml
          if grep -Fq '@android:color/black' android/app/src/main/res/values/styles.xml; then
            echo "::error title=Thème Android non déterministe::texte natif noir par défaut — une app sombre ne peut pas avoir de chrome natif clair"
            exit 1
          fi

      # Tests unitaires JVM du module natif (Robolectric) — exécutés AVANT
      # l'assemble : un invariant Media3 cassé doit bloquer la release, pas
      # passer en production. (4.4.8 : invariants d'état VirtualMediaPlayer.)
      - name: Tests Kotlin du module média (Robolectric)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :melodix-media:testDebugUnitTest --console=plain 2>&1 | tee ../gradle-test.log

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          # Conserver les quatre ABI Expo/RN : l'APK reste installable sur ARM
          # physique comme sur appareil/émulateur x86 ou x86_64.
          ./gradlew assembleRelease --console=plain 2>&1 | tee ../gradle-build.log

      - name: Aligner 16 Kio et signer l'APK de test
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          ALIGNED=app/build/outputs/apk/release/app-release-aligned.apk
          [ -s "$APK" ] || { echo "::error title=APK absent::Gradle n'a pas produit l'APK attendu"; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          [ -x "$BUILD_TOOLS/zipalign" ] || { echo "::error title=zipalign indisponible::outil absent ou non exécutable"; exit 1; }
          [ -x "$BUILD_TOOLS/apksigner" ] || { echo "::error title=apksigner indisponible::outil absent ou non exécutable"; exit 1; }
          # AGP/Expo 51 aligne encore les bibliothèques natives sur 4 Kio. Un
          # appareil Android à pages mémoire de 16 Kio peut alors refuser ou ne
          # pas lancer l'APK. Réalignement AVANT une nouvelle signature avec le
          # même certificat de test stable fourni par le template Expo.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$APK.signed" \
            "$ALIGNED"
          mv "$APK.signed" "$APK"
          rm -f "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Afficher l'erreur de compilation
        if: failure()
        run: |
          # Remonte l'erreur Gradle en annotation (visible dans l'onglet Actions et via l'API GitHub)
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/'%0D'}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          for LOG in gradle-build.log gradle-test.log jest.log; do
            [ -f "$LOG" ] || continue
            WHAT=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{if(f) exit}' "$LOG" | head -60)
            if [ -n "$WHAT" ]; then echo "::error title=Gradle ($LOG)::$(esc "$WHAT")"; fi
            ERRS=$(grep -E '^e: |error:|Error:|FAILED|AssertionError|^FAIL |Test Suites:.*failed|Tests:.*failed' "$LOG" | head -40 || true)
            if [ -n "$ERRS" ]; then echo "::error title=Erreurs ($LOG)::$(esc "$ERRS")"; fi
          done

      - name: Nommer l'APK
        id: apk
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLISH_TEST: ${{ steps.release_guard.outputs.publish_test }}
          RELEASE_TAG: ${{ steps.release_guard.outputs.release_tag }}
        run: |
          if [ "$EVENT" = "release" ]; then
            VERSION="$TAG"
          elif [ "${PUBLISH_TEST:-false}" = "true" ] && [ -n "${RELEASE_TAG:-}" ]; then
            # Build publiable en Release : nom STABLE et lisible, dérivé du
            # tag résolu — jamais d'un suffixe SHA qui changerait à chaque
            # run et rendrait le téléchargement illisible.
            VERSION="$RELEASE_TAG"
          else
            VERSION="v$(node -p "require('./package.json').version")-${BUILD_SHA::7}"
          fi
          NAME="Melodix-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 $NAME"
            echo ""
            echo "- Commit source : \`$BUILD_SHA\`"
            echo "- Taille : $(du -h "$NAME" | cut -f1)"
            echo "- SHA-256 : \`$(sha256sum "$NAME" | cut -d' ' -f1)\`"
            if [ -n "$MELODIX_BACKEND_URL" ]; then
              echo "- Backend Melodix : intégré (valeur masquée)"
            else
              echo "- Backend Melodix : NON configuré — repli catalogue Audius + historique local"
            fi
            if [ -n "$AUDIUS_API_KEY" ]; then
              echo "- Clé API Audius : intégrée"
            else
              echo "- Clé API Audius : nœuds publics de découverte"
            fi
            # Config Spotify vérifiée AVANT le build (étape de validation) :
            # la valeur effective est garantie présente et le redirect est le
            # canonique — le résumé le dit sans re-checker.
            echo "- Client ID Spotify (connexion OAuth PKCE) : intégré (valeur masquée)"
            echo "- Redirect URI Spotify : melodix://callback (canonique — Dashboard Spotify du client)"
            echo "- Audio : Audius · Métadonnées : backend Melodix · Compte : connexion Spotify OAuth PKCE (Melodix 4.0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier intégrité, installabilité et signature de l'APK
        env:
          APK: ${{ steps.apk.outputs.name }}
          EXPECTED_PACKAGE: com.souxch06.melodix
          EXPECTED_VERSION_CODE: '45032'
          EXPECTED_VERSION_NAME: 4.5.0-test.32
          EXPECTED_MIN_SDK: '23'
          EXPECTED_TARGET_SDK: '34'
          EXPECTED_SCHEME: melodix
          EXPECTED_ABIS: arm64-v8a,armeabi-v7a,x86,x86_64
        run: |
          chmod +x scripts/verify-android-apk.sh
          set +e
          scripts/verify-android-apk.sh "$APK" apk-inspection.txt
          VERIFY_EXIT=$?
          set -e
          if [ "$VERIFY_EXIT" -ne 0 ]; then
            DETAIL=$(tail -80 apk-inspection.txt 2>/dev/null || echo 'rapport indisponible')
            DETAIL="${DETAIL//'%'/'%25'}"; DETAIL="${DETAIL//$'\r'/'%0D'}"; DETAIL="${DETAIL//$'\n'/'%0A'}"
            echo "::error title=APK non publiable::$DETAIL"
            exit "$VERIFY_EXIT"
          fi
          INFO=$(grep -E "^(package|application-label|sdkVersion|minSdkVersion|targetSdkVersion|native-code):" apk-inspection.txt | tr '\n' ' ')
          CERT=$(grep -E '^(Signer #1|V3\.0 Signer): certificate SHA-256 digest:' apk-inspection.txt | head -1)
          echo "::notice title=$APK::$INFO| $CERT | taille $(du -h "$APK" | cut -f1) | sha256 $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "::notice title=Deep link OAuth::scheme melodix présent dans l'APK (melodix://callback déclenchable)"

      - name: Autoriser l'accélération de l'émulateur Android
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chown "$USER" /dev/kvm

      - name: Installer et lancer réellement l'APK sur Android 14
        # Commit épinglé de ReactiveCircus/android-emulator-runner v2.38.0 :
        # jamais de tag flottant pour une action qui exécute du code tiers.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Cette action découpe une valeur multiligne et exécute chaque ligne
          # dans un shell indépendant. Toute la vérification doit donc vivre
          # dans un script versionné appelé par une unique ligne.
          script: scripts/smoke-test-android-apk.sh "${{ steps.apk.outputs.name }}"

      - name: Diagnostic OAuth Spotify (TEMPORAIRE — build de test)
        # Oracle build-level : révèle QUELLE source d'injection a gagné, sans
        # exposer d'identifiant complet (préfixe 6 + longueur + hash court).
        # TOUT ÉCHEC ici = build incohérent avec le dashboard Spotify.
        env:
          APK: ${{ steps.apk.outputs.name }}
          VAR_CID: ${{ vars.SPOTIFY_CLIENT_ID }}
        run: |
          state() { if [ -n "$1" ]; then echo '<défini>'; else echo '<vide>'; fi; }
          CANONICAL_REDIRECT_URI='melodix://callback'
          # ── 1/7 Client ID : présent dans le build ET inliné dans le bundle ──
          # (l'inlining Metro est le canal réellement utilisé par l'APK bare ;
          #  la valeur ne quitte jamais le workflow — présence uniquement).
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
            if unzip -p "$APK" assets/index.android.bundle 2>/dev/null | grep -aqF "$SPOTIFY_CLIENT_ID"; then
              echo "::notice title=SPOTIFY-DIAG 1/7 client_id::vars=$(state "$VAR_CID") | effectif=$(state "$SPOTIFY_CLIENT_ID") | inliné dans le bundle: OUI"
            else
              echo "::error title=SPOTIFY-DIAG 1/7 client_id::Client ID présent en env mais ABSENT du bundle — inlining Metro inopérant, l'app affichera « non configurée » malgré la config CI"
              exit 1
            fi
          else
            echo "::error title=SPOTIFY-DIAG 1/7 client_id::Client ID ABSENT du build — test physique Spotify impossible"
            exit 1
          fi
          # ── 2/7 Redirect URI : valeur déterministe du workflow ──
          echo "::notice title=SPOTIFY-DIAG 2/7 redirect_uri::source=workflow déterministe | effectif=$(state "$SPOTIFY_REDIRECT_URI") ($SPOTIFY_REDIRECT_URI)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
          [ -x "$APKANALYZER" ] || { echo "::error title=apkanalyzer indisponible::outil absent ou non exécutable"; exit 1; }
          # ── 3/7 scheme natif melodix : TOUJOURS déclaré (reste de l'app) ──
          if "$APKANALYZER" manifest print "$APK" | grep -Fq 'android:scheme="melodix"'; then
            echo "::notice title=SPOTIFY-DIAG 3/7 scheme natif::melodix présent dans le manifest final (deep links internes conservés)"
          else
            echo "::error title=SPOTIFY-DIAG 3/7 scheme natif::melodix absent du manifest final — deep links internes cassés"
            exit 1
          fi
          # ── 4/7 Redirect effectif : EXACTEMENT le canonique du client ──
          # Le bundle DOIT contenir le redirect canonique
          # melodix://callback. L'ancienne URI de test historique = build
          # inutilisable pour le test physique (mismatch garanti).
          EFFECTIVE_URI="${SPOTIFY_REDIRECT_URI:-}"
          if [ "$EFFECTIVE_URI" != "$CANONICAL_REDIRECT_URI" ]; then
            if [ "$EFFECTIVE_URI" = "comspotifytestsdk://callback" ]; then
              echo "::error title=SPOTIFY-DIAG 4/7 redirect effectif::le redirect effectif du build est l'ancienne URI de test comspotifytestsdk://callback (dashboard périmé) — « redirect_uri: not matching configuration » garanti côté Spotify. Attendu : $CANONICAL_REDIRECT_URI"
            else
              echo "::error title=SPOTIFY-DIAG 4/7 redirect effectif::le redirect effectif du build est vide ou non canonique (attendu : $CANONICAL_REDIRECT_URI)"
            fi
            exit 1
          fi
          if unzip -p "$APK" assets/index.android.bundle 2>/dev/null | grep -aqF "$EFFECTIVE_URI"; then
            echo "::notice title=SPOTIFY-DIAG 4/7 bundle::redirect URI effectif $EFFECTIVE_URI inliné dans le bundle JS (authorize + token exchange utiliseront exactement cette valeur)"
          else
            echo "::error title=SPOTIFY-DIAG 4/7 bundle::redirect URI $EFFECTIVE_URI absent du bundle — build incohérent"
            exit 1
          fi
          # ── 5/7 intent-filter du redirect canonique dans le manifest final ──
          # sans lui, Android ne routerait jamais le callback Spotify vers
          # l'app (le callback ne reviendrait jamais).
          REDIRECT_SCHEME="${EFFECTIVE_URI%%://*}"
          REDIRECT_HOST="${EFFECTIVE_URI#*://}"
          REDIRECT_HOST="${REDIRECT_HOST%%/*}"
          MANIFEST_PRINT="$("$APKANALYZER" manifest print "$APK")"
          if printf '%s\n' "$MANIFEST_PRINT" | grep -Fq 'android:scheme="comspotifytestsdk"'; then
            echo "::error title=SPOTIFY-DIAG 5/7 manifest final contaminé::l'ancienne URI de test comspotifytestsdk est présente dans le manifest final du build — test physique garanti défaillant"
            exit 1
          fi
          if [ "$REDIRECT_SCHEME" = "melodix" ]; then
            # Redirect canonique : le scheme natif `melodix` (déclaré SANS
            # host) route TOUTES les URLs melodix://*, dont le callback —
            # la vérification du host exact est faite par l'app elle-même
            # (url.startsWith(redirect)).
            if printf '%s\n' "$MANIFEST_PRINT" | grep -Fq "android:scheme=\"$REDIRECT_SCHEME\""; then
              echo "::notice title=SPOTIFY-DIAG 5/7 intent-filter::intent-filter $REDIRECT_SCHEME (redirect canonique $EFFECTIVE_URI) présent dans le manifest final — le callback Spotify est routable vers l'app"
            else
              echo "::error title=SPOTIFY-DIAG 5/7 intent-filter::intent-filter $REDIRECT_SCHEME absent du manifest final — Android ne routerait jamais le callback Spotify vers l'app"
              exit 1
            fi
          else
            # Scheme non canonique (refusé par la validation pré-build) : le
            # filtre dérivé par app.config.js doit déclarer scheme ET host.
            if printf '%s\n' "$MANIFEST_PRINT" | grep -Fq "android:scheme=\"$REDIRECT_SCHEME\"" \
              && printf '%s\n' "$MANIFEST_PRINT" | grep -Fq "android:host=\"$REDIRECT_HOST\""; then
              echo "::notice title=SPOTIFY-DIAG 5/7 intent-filter::intent-filter $REDIRECT_SCHEME://$REDIRECT_HOST présent dans le manifest final — le callback Spotify est routable vers l'app"
            else
              echo "::error title=SPOTIFY-DIAG 5/7 intent-filter::intent-filter $REDIRECT_SCHEME://$REDIRECT_HOST absent du manifest final — Android ne routerait jamais le callback Spotify vers l'app"
              exit 1
            fi
          fi
          # Fixture smoke (build de test) : le bundle DOIT contenir la route
          # de seed — sinon le scénario B du smoke Android est inopérant.
          if unzip -p "$APK" assets/index.android.bundle 2>/dev/null | grep -aqF "oauth-smoke-seed"; then
            echo "::notice title=SPOTIFY-DIAG 6/7 fixture smoke::route melodix://oauth-smoke-seed inlinée dans le bundle (build de test) — wiring cold-start AVEC transaction persistée vérifiable en smoke"
          else
            echo "::error title=SPOTIFY-DIAG 6/7 fixture smoke::route de seed absente du bundle — EXPO_PUBLIC_SPOTIFY_OAUTH_SMOKE non inliné, scénario B du smoke impossible"
            exit 1
          fi
          # Limite CI DÉCLARÉE, jamais implicite : GitHub Actions n'a aucun
          # compte Spotify utilisable. Le smoke ci-dessus prouve la chaîne
          # deep-link → runtime JS → classification [SpotifyAuth] sur
          # Android 14 réel (émulateur) — pas un login Spotify.
          echo "::notice title=SPOTIFY-DIAG 7/7 limite CI::PHYSICAL SPOTIFY LOGIN NOT TESTABLE IN CI — le login Spotify réel exige un appareil + un compte ; le scénario B du smoke prouve le wiring cold-start AVEC transaction persistée, pas un login"

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            apk-inspection.txt
          if-no-files-found: error

      # ------------------------------------------------------------------
      # GITHUB RELEASE DE TEST
      # Créée UNIQUEMENT si toutes les étapes précédentes ont réussi : les
      # étapes GitHub Actions sont séquentielles, un build en échec
      # n'atteint jamais cette ligne. Les garde-fous de branche, de commit
      # et de tag ont déjà été résolus en début de job.
      # ------------------------------------------------------------------
      - name: Publier la GitHub Release de test (APK téléchargeable)
        if: ${{ success() && steps.release_guard.outputs.publish_test == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          TAG: ${{ steps.release_guard.outputs.release_tag }}
          COMMIT: ${{ steps.release_guard.outputs.commit }}
          EFFECTIVE_URI: ${{ env.SPOTIFY_REDIRECT_URI }}
        run: |
          set -Eeuo pipefail

          # Garde-fou final : ce build est destiné au test OAuth physique et
          # DOIT embarquer le redirect canonique de l'application (celui
          # déclaré dans le Dashboard Spotify du client). Un retour
          # accidentel sur l'ancienne URI de test historique ferait échouer
          # le test physique sans que rien ne le signale — on bloque AVANT
          # publication.
          if [ "$EFFECTIVE_URI" != "melodix://callback" ]; then
            echo "::error title=Redirect URI non canonique::ce build doit embarquer le redirect canonique melodix://callback (effectif : $EFFECTIVE_URI). Aucune Release publiée."
            exit 1
          fi

          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c '%s' "$APK")
          TITLE="Melodix ${TAG#v} — Test"
          VERSION="$(node -p "require('./package.json').version")"

          # Notes honnêtes : seules les fonctionnalités RÉELLEMENT présentes
          # dans le commit construit sont mentionnées, et la validation
          # physique reste explicitement requise.
          NOTES=$(cat <<EOF
          # ${TITLE}

          > **Build de test — validation physique nécessaire.**
          > L'audio en arrière-plan, le Bluetooth/casque, l'écran verrouillé
          > et la lecture réelle ne sont pas validés : ils doivent être testés
          > sur le Samsung Galaxy S24.

          ## Version

          - Tag : \`${TAG}\`
          - Version : \`${VERSION}\`
          - Commit : \`${COMMIT}\`
          - Branche : \`arena/fcdae8c6-melodix\`
          - Workflow run : \`${{ github.run_id }}\`

          ## Spotify (test OAuth)

          Ce build embarque le redirect URI canonique de l'application :

          \`melodix://callback\`

          URI déclarée dans le Dashboard Spotify du Client ID Melodix —
          c'est elle que l'application envoie à /authorize ET /api/token
          (unicité de source, PKCE sans secret). Jamais d'ancienne URI de
          test historique dans un build réel : elle produirait une erreur
          « redirect_uri: not matching configuration ». Le bundle JS et le
          manifeste de l'APK sont vérifiés en CI avant publication.

          ## Nouveautés principales

          Fonctionnalités réellement présentes dans ce commit :

          - Lecteur avec les neuf états (\`idle\`, \`loading\`, \`resolving\`,
            \`buffering\`, \`playing\`, \`paused\`, \`ended\`, \`error\`,
            \`unavailable\`)
          - Recherche Spotify : titres, artistes, albums, playlists —
            résultats cliquables
          - Albums et artistes via la session Spotify
          - Titres aimés Spotify
          - Cascade audio Audius → YouTube
          - File de lecture, lecture automatique, shuffle, repeat
          - Audio en arrière-plan, MediaSession, notification
          - Historique de lecture
          - Playlists (pagination)

          ## Vérifications CI

          - Tests Jest : exécutés
          - TypeScript : exécuté
          - ESLint : exécuté
          - Prettier : exécuté
          - Bundle JS Android : généré
          - APK : compilé, aligné 16 Kio, signé, intégrité vérifiée
          - installation + smoke test sur émulateur Android 14 : exécutés

          ## Intégrité

          - Fichier : \`${APK}\`
          - Taille : ${SIZE} octets
          - SHA-256 : \`${SHA256}\`

          ## Installation

          1. Télécharger l'APK ci-dessous.
          2. Autoriser les sources inconnues sur le téléphone.
          3. Installer (le \`versionCode\` est supérieur au précédent : une mise
             à jour normale fonctionne).
          EOF
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Tag réutilisé sur le MÊME commit (garanti par release_guard) :
            # on met à jour la Release existante, on n'en crée pas d'autre.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

          echo "::notice title=Release publiée::${TAG} — ${APK} — SHA-256 ${SHA256}"

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK" --clobber
